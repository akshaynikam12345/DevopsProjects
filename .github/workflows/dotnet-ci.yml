name: Deploy .NET App to Windows VM

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      # 1️⃣ Checkout your code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup .NET
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'   # adjust to your target version (e.g. 6.0.x, 7.0.x)

      # 3️⃣ Restore dependencies
      - name: Restore dependencies
        run: dotnet restore WebApplication5/WebApplication5.csproj

      # 4️⃣ Build project
      - name: Build
        run: dotnet build WebApplication5/WebApplication5.csproj --configuration Release --no-restore

      # 5️⃣ Run tests (optional if you have a test project)
      - name: Run unit tests
        run: dotnet test WebApplication5/WebApplication5.csproj --no-build --verbosity normal

      # Step 5: Publish (output to folder)
      - name: Publish
        run: dotnet publish WebApplication5/WebApplication5.csproj --configuration Release --no-build --output ./publish

      # Step 6: Upload published output as artifact (optional)
      - name: Upload published files
        uses: actions/upload-artifact@v4
        with:
          name: published-app
          path: ./publish

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Download build artifact
      uses: actions/download-artifact@v4
      with:
        name: published-app
        path: ./deploy

    - name: Deploy to Windows VM
      uses: appleboy/ssh-action@v1.1.0
      with:
        host: ${{ secrets.WINDOWS_VM_HOST }}
        username: ${{ secrets.WINDOWS_VM_USER }}
        password: ${{ secrets.WINDOWS_VM_PASS }}
        script_stop: true
        script: |
          mkdir -p /c/inetpub/myapp
          cp -r ./deploy/* /c/inetpub/myapp/
          powershell.exe "iisreset"
